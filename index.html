<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gph-advent</title>
    <link rel="preload" href="/src/assets/splash/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/assets/fonts.css" />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/assets/loading/loading.css" />
    <style>body { margin: 0; }</style>
  </head>
  <body>
    <div id="app">
      <div class="screen-loader" id="startup-loader">
        <div class="screen-loader-content">
          <img class="screen-loader-snowflake" src="/src/assets/loading/snowflake.svg" width="75" height="76" alt="" />
          <p class="screen-loader-label" id="startup-status" role="status">Открываем календарь...</p>
          <div class="screen-loader-error"><button id="startup-retry" type="button" hidden>Попробовать снова</button></div>
        </div>
      </div>
    </div>
    <script>
      const startupTask = Number(location.pathname.match(/^\/task\/(\d+)/)?.[1]);
      document.getElementById('startup-loader').dataset.theme = location.pathname.startsWith('/calendar') ? 'calendar' : [4,6,7,11,14,17,19,21,25].includes(startupTask) || ['/', '/rules'].includes(location.pathname.replace(/\/$/, '') || '/') ? 'night' : 'warm';
      document.getElementById('startup-loader').toggleAttribute('data-splash', location.pathname === '/');
      if (startupTask) document.getElementById('startup-status').textContent = 'Загружаем задание...';
      // This must run before the entry module: it also covers a missing entry
      // chunk, when main.ts cannot register its own retry handler.
      (() => {
        const retry = document.getElementById('startup-retry');
        const fail = (reason, source) => {
          if (!document.getElementById('startup-loader')) return;
          const status = document.getElementById('startup-status');
          status.textContent = 'Не удалось запустить приложение. Обновите страницу и попробуйте снова.';
          status.setAttribute('role', 'alert');
          retry.hidden = false;
          retry.focus();
          let safe = '[unknown URL]';
          try {
            const url = new URL(source, location.href);
            if (url.origin === location.origin && /^\/assets\/[\w.-]+-[\w-]{8}\.js$/.test(url.pathname)) safe = url.origin + url.pathname;
          } catch {}
          console.error('[advent] critical module ' + reason + ': ' + safe);
        };
        retry.addEventListener('click', () => location.reload());
        const timer = setTimeout(() => fail('timeout'), 30000);
        const failedModule = event => {
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module') {
            clearTimeout(timer);
            fail('load', event.target.src);
          }
        };
        window.addEventListener('error', failedModule, true);
        window.addEventListener('advent:mounted', () => {
          clearTimeout(timer);
          window.removeEventListener('error', failedModule, true);
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
