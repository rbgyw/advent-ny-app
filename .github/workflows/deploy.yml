name: Deploy Advent to SpaceWeb

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spaceweb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Audit compiled resources
        run: npm run audit:build

      - name: Test publication ordering
        run: python3 -m unittest discover -s tests -p "deploy_sftp_test.py"

      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y python3-paramiko

      - name: Upload dist over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        # Assets first, atomic index replacement last, no deletion of old chunks.
        run: /usr/bin/python3 scripts/deploy-sftp.py
